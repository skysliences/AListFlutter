name: Check AList

on:
  schedule:
    # GitHub Actions cron uses UTC. These are 05:00 and 17:00 in Asia/Shanghai.
    - cron: "0 9,21 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/sync_alist.yaml"
      - ".github/scripts/check_alist.sh"

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-alist
  cancel-in-progress: false

jobs:
  check:
    name: Check latest stable AList release
    runs-on: ubuntu-latest
    env:
      ALIST_REPOSITORY: AlistGo/alist
      VERSION_FILE: ${{ github.workspace }}/alist_version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AList version
        id: alist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x .github/scripts/check_alist.sh
          .github/scripts/check_alist.sh

      - name: Update tracked AList version
        if: steps.alist.outputs.update == 'true'
        env:
          ALIST_VERSION: ${{ steps.alist.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes="$(
            gh api "repos/${ALIST_REPOSITORY}/releases/tags/${ALIST_VERSION}" \
              --jq '.body // ""'
          )"

          printf '%s\n' "${ALIST_VERSION}" > "${VERSION_FILE}"
          {
            printf '[自动同步 AList] %s\n\n' "${ALIST_VERSION}"
            printf '上游发布：https://github.com/%s/releases/tag/%s\n\n' \
              "${ALIST_REPOSITORY}" "${ALIST_VERSION}"
            printf '%s\n' "${release_notes}"
          } > CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alist_version CHANGELOG.md
          git commit -m "[bot] Update AList to ${ALIST_VERSION}"
          git push

      - name: Build and publish APK
        if: steps.alist.outputs.update == 'true'
        env:
          ALIST_VERSION: ${{ steps.alist.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yaml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}" \
            --field "alist_version=${ALIST_VERSION}"
