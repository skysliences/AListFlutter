name: Release

on:
  push:
    branches:
      - master
    paths:
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      alist_version:
        description: "AList release tag to build (for example v3.62.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.alist_version || github.sha }}
  cancel-in-progress: false

jobs:
  android:
    name: Build and publish Android APKs
    runs-on: ubuntu-latest
    env:
      APK_OUTPUT: ${{ github.workspace }}/build/app/outputs/apk/release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve AList version
        id: alist
        env:
          REQUESTED_VERSION: ${{ inputs.alist_version }}
        run: |
          version="${REQUESTED_VERSION}"
          if [[ -z "${version}" ]]; then
            version="$(tr -d '[:space:]' < alist_version)"
          fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid AList version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "ALIST_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Download AList source and web assets
        run: |
          cd "${GITHUB_WORKSPACE}/alist-lib/scripts"
          chmod +x ./*.sh
          ./init_alist.sh
          ./init_web.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: ${{ github.workspace }}/alist-lib/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AList Android library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd "${GITHUB_WORKSPACE}/alist-lib/scripts"
          ./init_gomobile.sh
          ./gobind.sh

      - name: Upload AList Android library
        uses: actions/upload-artifact@v4
        with:
          name: AList-${{ steps.alist.outputs.version }}
          path: ${{ github.workspace }}/android/app/libs/*.aar

      - name: Validate signing secrets
        env:
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          for name in ALIAS_NAME ALIAS_PASSWORD KEY_PASSWORD KEY_STORE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Initialize signing
        env:
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          {
            printf 'ALIAS_NAME=%s\n' "${ALIAS_NAME}"
            printf 'ALIAS_PASSWORD=%s\n' "${ALIAS_PASSWORD}"
            printf 'KEY_PASSWORD=%s\n' "${KEY_PASSWORD}"
            printf 'KEY_PATH=./key.jks\n'
          } > android/local.properties
          printf '%s' "${KEY_STORE}" | base64 --decode > android/app/key.jks

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          cache: true

      - name: Build release APKs
        run: flutter build apk --split-per-abi --release

      - name: Read app version
        id: app
        run: |
          app_version="$(
            jq --exit-status --raw-output \
              '.elements[0].versionName' \
              "${APK_OUTPUT}/output-metadata.json"
          )"
          release_version="${app_version}-alist-${ALIST_VERSION}"
          {
            echo "version=${app_version}"
            echo "release_version=${release_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AListFlutter-${{ steps.app.outputs.release_version }}
          path: ${{ env.APK_OUTPUT }}/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.app.outputs.release_version }}
          tag_name: ${{ steps.app.outputs.release_version }}
          body_path: ${{ github.workspace }}/CHANGELOG.md
          draft: false
          prerelease: false
          files: ${{ env.APK_OUTPUT }}/*.apk
